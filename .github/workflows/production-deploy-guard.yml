name: Deploy to Production

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read

# Two overlapping dispatches would each see the same migrations pending, each
# take their own backup, and then both run `d1 migrations apply` against the
# same production D1 — and afterwards there is no way to tell which of the two
# R2 backups is the real "before" snapshot. Serialize instead; never cancel a
# run mid-migration.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  pre-deploy-check:
    name: Pre-deploy checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Require successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" --jq '[.check_runs[] | select(.name == "Launch readiness gate")] | sort_by(.completed_at) | last | .conclusion')"
          if [ "$conclusion" != "success" ]; then
            echo "::error::Launch readiness gate has not succeeded for ${GITHUB_SHA}."
            exit 1
          fi

      - name: Check for REPLACE_WITH_ placeholders
        run: |
          if grep -q "REPLACE_WITH_" wrangler.jsonc; then
            echo "::error file=wrangler.jsonc::wrangler.jsonc contains REPLACE_WITH_ placeholder(s). Fill in live Clerk and Stripe keys before deploying to production."
            grep -n "REPLACE_WITH_" wrangler.jsonc
            exit 1
          fi
          echo "No REPLACE_WITH_ placeholders found. Proceeding with production deploy."

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Read-only preview of what the deploy job's predeploy:production hook is
      # about to auto-apply to the production D1. Auto-apply removes the beat
      # where a human notices a destructive migration; this puts that beat back
      # in the log, before anything is written. It also fails the run early if
      # CLOUDFLARE_API_TOKEN lacks D1 access, rather than mid-deploy.
      - name: Preview pending D1 migrations
        run: npm run db:migrate:status:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    name: Deploy
    needs: pre-deploy-check
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `predeploy:production` runs first (npm lifecycle hook) and does two
      # things before a single byte is built: the wrangler.jsonc placeholder
      # check, then scripts/d1-migrate.mjs, which backs up and applies any
      # pending D1 migrations. A non-zero exit there aborts this step, so the
      # Worker is never deployed against a half-migrated database.
      #
      # The pre-flight backup is uploaded to the PRIVATE R2 bucket
      # beauteas-db-backups — deliberately not a GitHub Actions artifact: a prod
      # d1 export is full customer PII and artifacts are downloadable by anyone
      # with repo read access. CLOUDFLARE_API_TOKEN therefore needs D1:Edit and
      # R2:Edit.
      - name: Deploy to production
        run: npm run deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
